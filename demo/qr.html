<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mã QR Điểm Di Tích · Thuyết Minh Tự Động TP. Hồ Chí Minh</title>
<meta name="description" content="Quét mã QR để mở trực tiếp thuyết minh tự động GPS các điểm di tích lịch sử Thành phố Hồ Chí Minh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6F4;
  --surface: #FFFFFF;
  --text: #0E1D19;
  --text-muted: #3D5A50;
  --accent: #C07F38;          /* Vàng đồng ngói di sản Sài Gòn */
  --accent-hover: #A76926;
  --accent-subtle: #FDF6EE;
  --emerald: #10B981;
  --emerald-subtle: #ECFDF5;
  --border: #D2DDD7;
  --radius: 20px;
  --radius-sm: 10px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow: 0 12px 36px rgba(14, 29, 25, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}

.qr-hero-card {
  max-width: 520px;
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 28px;
  box-shadow: var(--shadow);
  text-align: center;
  position: relative;
}

/* Brand Badge */
.brand-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: var(--accent-subtle);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  border-radius: 999px;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 6px;
}

.hero-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

/* Big Central QR Code Box */
.qr-frame-wrap {
  display: inline-block;
  background: #FFFFFF;
  padding: 16px;
  border-radius: 22px;
  border: 3px solid var(--text);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  margin-bottom: 16px;
  position: relative;
}

.qr-code-img {
  width: 280px;
  height: 280px;
  display: block;
  border-radius: 10px;
  background: #FFFFFF;
}

@media (min-width: 480px) {
  .qr-code-img {
    width: 320px;
    height: 320px;
  }
}

/* Landmark Label Banner */
.landmark-badge-wrap {
  background: var(--accent-subtle);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  margin-bottom: 20px;
}

.landmark-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-hover);
  margin-bottom: 2px;
}

.landmark-instruction {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}

/* Action Buttons */
.action-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, #A76926 100%);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(192, 127, 56, 0.3);
}
.btn-primary:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

.btn-outline {
  background: #FFFFFF;
  border: 1.5px solid var(--border);
  color: var(--text);
}
.btn-outline:hover {
  background: var(--bg);
  border-color: var(--accent);
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Collapsible Settings Drawer */
.settings-drawer {
  margin-top: 14px;
  border-top: 1.5px dashed var(--border);
  padding-top: 16px;
  text-align: left;
}

.settings-drawer summary {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  padding: 6px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings-drawer summary:hover {
  color: var(--accent);
}

.settings-body {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-group label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

select, input[type="text"] {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  font: inherit;
  font-size: 13px;
  background: #FFF;
  color: var(--text);
  outline: none;
}
select:focus, input[type="text"]:focus {
  border-color: var(--accent);
}

.url-clean-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  word-break: break-all;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

/* Print Stylesheet */
@media print {
  body {
    background: #FFF;
    padding: 0;
    justify-content: flex-start;
  }
  .qr-hero-card {
    border: none;
    box-shadow: none;
    max-width: 100%;
    padding: 20px;
  }
  .action-grid, .settings-drawer {
    display: none !important;
  }
  .qr-code-img {
    width: 380px !important;
    height: 380px !important;
  }
}
</style>
</head>
<body>

<div class="qr-hero-card">
  <!-- Brand Badge -->
  <div class="brand-pill">
    <span>🏛️</span>
    <span>THUYẾT MINH DI TÍCH SÀI GÒN — TP.HCM</span>
  </div>

  <!-- Hero Title -->
  <h1 class="hero-title">Quét Mã QR Để Nghe Thuyết Minh</h1>
  <p class="hero-subtitle">Mở ứng dụng tự động định vị GPS & 20 ngôn ngữ quốc tế</p>

  <!-- Big Central QR Code -->
  <div class="qr-frame-wrap">
    <img id="qrImage" class="qr-code-img" alt="Mã QR Điểm Di Tích">
  </div>

  <!-- Landmark Banner -->
  <div class="landmark-badge-wrap">
    <div id="landmarkTitle" class="landmark-name">🏛️ Dinh Độc Lập</div>
    <div class="landmark-instruction">📷 Hướng Camera điện thoại vào mã QR trên để mở ngay bài thuyết minh</div>
  </div>

  <!-- Action Buttons -->
  <div class="action-grid">
    <a id="btnOpenTarget" class="btn btn-primary" href="#" target="_blank">
      🚀 Mở Trực Tiếp Trải Nghiệm (Tab Mới)
    </a>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="downloadQrPng()">
        📥 Tải Ảnh PNG
      </button>
      <button class="btn btn-outline" onclick="window.print()">
        🖨️ In Standee (A4)
      </button>
    </div>
  </div>

  <!-- Collapsible Settings for Administrators -->
  <details class="settings-drawer">
    <summary>⚙️ Tùy chỉnh nâng cao (Dành cho Ban Quản trị)</summary>
    <div class="settings-body">
      <!-- Chọn Điểm Di Tích Sài Gòn -->
      <div class="form-group">
        <label for="poiSelect">📍 Điểm Di Tích Trọng Tâm:</label>
        <select id="poiSelect" onchange="onPoiChanged()">
          <option value="">-- Mở Toàn Cảnh Sài Gòn --</option>
        </select>
      </div>

      <!-- Chọn Ngôn Ngữ Mặc Định -->
      <div class="form-group">
        <label for="langSelect">🌐 Ngôn Ngữ Khởi Tạo:</label>
        <select id="langSelect" onchange="updateQrCode()">
          <!-- 20 ngôn ngữ được nạp động -->
        </select>
      </div>

      <!-- Chọn Tour Tham Quan -->
      <div class="form-group">
        <label for="tourSelect">🧭 Lộ Trình Tour Gợi Ý:</label>
        <select id="tourSelect" onchange="updateQrCode()">
          <option value="">-- Tham quan tự do (Không theo tour) --</option>
        </select>
      </div>

      <!-- Địa chỉ IP Mạng LAN Wi-Fi -->
      <div class="form-group">
        <label for="lanOriginInput">🌐 Địa Chỉ Mạng LAN (Dành Cho Điện Thoại Quét QR):</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="lanOriginInput" placeholder="http://192.168.1.x:8080" oninput="onLanOriginChanged()">
          <select id="lanIpPresetSelect" onchange="onLanPresetSelected()" style="max-width:140px;font-size:11px;">
            <option value="">-- Chọn IP --</option>
          </select>
        </div>
      </div>

      <!-- Clean URL Preview (Không làm lộ token hay secret key) -->
      <div class="form-group">
        <label>🔗 Liên Kết Truy Cập Sạch Của Mã QR:</label>
        <div class="url-clean-box">
          <span id="urlPreviewText" style="flex:1;">...</span>
          <button style="border:none;background:#FFF;padding:3px 8px;border-radius:4px;cursor:pointer;font-weight:700;font-size:11px;" onclick="copyCleanUrl()">📋 Copy</button>
        </div>
      </div>
    </div>
  </details>
</div>

<script src="api-client.js"></script>
<script>
let bootstrapData = { pois: [], tours: [] };

async function loadData() {
  await initLanNetworkInfo();
  try {
    const res = await ApiClient.fetchBootstrapData();
    if (res.ok && res.pois) {
      bootstrapData = res;
      populatePoiSelect();
    }
  } catch (e) {
    console.debug('Lỗi bootstrap:', e);
  }

  // Nạp 20 ngôn ngữ từ Backend API
  try {
    const langRes = await ApiClient.fetchLanguages();
    const langSel = document.getElementById('langSelect');
    if (langRes.ok && Array.isArray(langRes.languages)) {
      langSel.innerHTML = langRes.languages.map(l => `
        <option value="${l.code}">
          ${l.flag || '🌐'} ${l.nativeName} (${l.code.toUpperCase()}) ${l.isAvailable ? '✓' : '(Đang cập nhật)'}
        </option>
      `).join('');
    }
  } catch (e) {}

  updateQrCode();
}

async function initLanNetworkInfo() {
  const originInput = document.getElementById('lanOriginInput');
  const presetSelect = document.getElementById('lanIpPresetSelect');

  const saved = localStorage.getItem('tmtd-lan-origin');
  const currentHost = window.location.hostname;
  const currentPort = window.location.port || '8080';
  const defaultFallback = (currentHost && currentHost !== 'localhost' && currentHost !== '127.0.0.1')
    ? `${window.location.protocol}//${currentHost}:${currentPort}`
    : `http://localhost:${currentPort}`;

  let detectedPrimary = '';
  const options = [];

  try {
    const netRes = await ApiClient.fetchNetworkInfo();
    if (netRes.ok && netRes.data) {
      const d = netRes.data;
      if (d.addresses && d.addresses.length > 0) {
        d.addresses.forEach(ip => {
          options.push({ label: `📱 ${ip}:${d.webPort || 8080}`, url: `http://${ip}:${d.webPort || 8080}` });
        });
      }
      if (d.primaryIp && d.primaryIp !== 'localhost') {
        detectedPrimary = `http://${d.primaryIp}:${d.webPort || 8080}`;
      }
    }
  } catch (e) {}

  options.push({ label: `💻 localhost:${currentPort}`, url: `http://localhost:${currentPort}` });

  presetSelect.innerHTML = '<option value="">-- Chọn IP LAN --</option>' +
    options.map(opt => `<option value="${opt.url}">${opt.label}</option>`).join('');

  const chosen = saved || detectedPrimary || defaultFallback;
  originInput.value = chosen;
}

function onLanOriginChanged() {
  const val = (document.getElementById('lanOriginInput').value || '').trim();
  if (val) localStorage.setItem('tmtd-lan-origin', val);
  updateQrCode();
}

function onLanPresetSelected() {
  const sel = document.getElementById('lanIpPresetSelect');
  if (sel.value) {
    document.getElementById('lanOriginInput').value = sel.value;
    localStorage.setItem('tmtd-lan-origin', sel.value);
    updateQrCode();
  }
}

function populatePoiSelect() {
  const poiSel = document.getElementById('poiSelect');
  const tourSel = document.getElementById('tourSelect');

  if (Array.isArray(bootstrapData.pois) && bootstrapData.pois.length > 0) {
    poiSel.innerHTML = '<option value="">-- Mở Toàn Cảnh Sài Gòn --</option>' +
      bootstrapData.pois.map(p => `<option value="${p.id}">🏛️ ${p.name}</option>`).join('');
    
    // Kiểm tra URL query param ?poi=
    const urlParams = new URLSearchParams(window.location.search);
    const poiParam = urlParams.get('poi');
    if (poiParam) {
      poiSel.value = poiParam;
      onPoiChanged();
    }
  }

  if (Array.isArray(bootstrapData.tours) && bootstrapData.tours.length > 0) {
    tourSel.innerHTML = '<option value="">-- Tham quan tự do (Không theo tour) --</option>' +
      bootstrapData.tours.map(t => `<option value="${t.id}">🧭 ${t.name} (${t.estimatedMinutes}p)</option>`).join('');
  }
}

function onPoiChanged() {
  const poiSel = document.getElementById('poiSelect');
  const landmarkTitle = document.getElementById('landmarkTitle');
  const selectedPoi = bootstrapData.pois?.find(p => p.id === poiSel.value);

  if (selectedPoi) {
    landmarkTitle.textContent = `🏛️ ${selectedPoi.name}`;
  } else {
    landmarkTitle.textContent = '🏛️ Toàn Cảnh Di Tích Sài Gòn — TP.HCM';
  }
  updateQrCode();
}

function getCleanQrUrl() {
  const poi = document.getElementById('poiSelect')?.value || '';
  const lang = document.getElementById('langSelect')?.value || 'vi';
  const tour = document.getElementById('tourSelect')?.value || '';

  const lanOrigin = (document.getElementById('lanOriginInput')?.value || '').trim().replace(/\/+$/, '') || window.location.origin;
  const base = `${lanOrigin}/index.html`;

  const params = new URLSearchParams();
  if (poi) params.set('poi', poi);
  if (lang && lang !== 'vi') params.set('lang', lang);
  if (tour) params.set('tour', tour);

  const qs = params.toString();
  return qs ? `${base}?${qs}` : base;
}

function updateQrCode() {
  const targetUrl = getCleanQrUrl();
  document.getElementById('urlPreviewText').textContent = targetUrl;
  document.getElementById('btnOpenTarget').href = targetUrl;

  // Tạo mã QR chất lượng cao (400x400)
  const qrUrl = 'https://quickchart.io/qr?size=400&text=' + encodeURIComponent(targetUrl);
  document.getElementById('qrImage').src = qrUrl;
}

function downloadQrPng() {
  const img = document.getElementById('qrImage');
  const poiSel = document.getElementById('poiSelect');
  const fileName = `QR_${poiSel.value || 'SaiGon_Heritage'}.png`;

  fetch(img.src)
    .then(r => r.blob())
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    })
    .catch(() => {
      window.open(img.src, '_blank');
    });
}

function copyCleanUrl() {
  const text = document.getElementById('urlPreviewText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('✓ Đã sao chép liên kết vào clipboard!');
  }).catch(() => {
    prompt('Sao chép liên kết tại đây:', text);
  });
}

// Khởi chạy
loadData();
</script>
</body>
</html>
