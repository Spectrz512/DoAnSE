services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linh_ung
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linh_ung"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  api:
    image: ${BACKEND_IMAGE:-gps-chua-linh-ung-backend:latest}
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/linh_ung?schema=public
      JWT_SECRET: local-development-secret-change-me
      ADMIN_API_KEY: local-admin-key-change-me
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: