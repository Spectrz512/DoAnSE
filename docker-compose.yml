services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gps_guide
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: gps
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d gps_guide"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
volumes:
  postgres_data:

