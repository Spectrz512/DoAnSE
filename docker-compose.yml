services:
  db:
    image: postgres:16-alpine
    container_name: da_cnpm-db-1
    environment:
      POSTGRES_DB: linh_ung
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linh_ung"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ${BACKEND_IMAGE:-gps-chua-linh-ung-backend:latest}
    container_name: da_cnpm-api-1
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/linh_ung?schema=public
      JWT_SECRET: local-development-secret-change-me
      ADMIN_API_KEY: local-admin-key-change-me
      PORT: 3000
      SERVER_LAN_IP: ${SERVER_LAN_IP:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: da_cnpm-web-1
    ports:
      - "8080:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata: